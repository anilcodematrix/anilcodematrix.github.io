<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Anil Sharma - AI Assistant</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0d0221;--surface:#160b33;--surface2:#1a0a3d;
    --accent:#7c3aed;--accent2:#a855f7;--accent3:#c084fc;
    --text:#e2e8f0;--text2:#a78bfa;--text3:#7c3aed;
    --border:#2d1b69;--user-bg:#7c3aed;--bot-bg:#160b33;
  }
  body{background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;
    color:var(--text);min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;overflow:hidden;}

  /* Animated background particles */
  .bg-particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;overflow:hidden;pointer-events:none;}
  .particle{position:absolute;border-radius:50%;background:var(--accent);opacity:0.15;animation:float linear infinite;}
  @keyframes float{0%{transform:translateY(100vh) rotate(0deg);opacity:0}
    10%{opacity:0.15}90%{opacity:0.08}100%{transform:translateY(-100px) rotate(360deg);opacity:0}}

  /* Header */
  .header{position:fixed;top:0;left:0;right:0;z-index:100;
    background:linear-gradient(135deg,rgba(13,2,33,0.95),rgba(22,11,51,0.95));
    backdrop-filter:blur(20px);border-bottom:1px solid var(--border);
    padding:12px 24px;display:flex;align-items:center;gap:12px;}
  .avatar{width:42px;height:42px;border-radius:50%;border:2px solid var(--accent3);
    overflow:hidden;flex-shrink:0;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .header-info h1{font-size:1rem;font-weight:700;color:var(--accent3);}
  .header-info p{font-size:0.72rem;color:var(--text2);margin-top:1px;}
  .status-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;
    animation:pulse-dot 2s ease-in-out infinite;margin-left:auto;}
  @keyframes pulse-dot{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,0.4)}
    50%{box-shadow:0 0 0 6px rgba(34,197,94,0)}}
  .github-link{color:var(--text2);text-decoration:none;font-size:0.75rem;
    padding:6px 12px;border:1px solid var(--border);border-radius:20px;
    transition:all 0.2s;margin-left:12px;}
  .github-link:hover{background:var(--accent);border-color:var(--accent);color:#fff;}

  /* Chat container */
  .chat-wrap{position:relative;z-index:10;width:100%;max-width:760px;
    height:100vh;display:flex;flex-direction:column;padding-top:72px;}
  .messages{flex:1;overflow-y:auto;padding:20px 16px;display:flex;
    flex-direction:column;gap:16px;scroll-behavior:smooth;}
  .messages::-webkit-scrollbar{width:4px}
  .messages::-webkit-scrollbar-track{background:transparent}
  .messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

  /* Messages */
  .msg{display:flex;gap:10px;align-items:flex-start;animation:fadeUp 0.3s ease;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .msg.user{flex-direction:row-reverse;}
  .msg-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;}
  .msg.bot .msg-avatar{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}
  .msg.user .msg-avatar{background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff;}
  .msg-bubble{max-width:78%;padding:12px 16px;border-radius:18px;line-height:1.6;
    font-size:0.88rem;position:relative;}
  .msg.bot .msg-bubble{background:var(--bot-bg);border:1px solid var(--border);
    border-top-left-radius:4px;color:var(--text);}
  .msg.user .msg-bubble{background:linear-gradient(135deg,var(--user-bg),#6d28d9);
    border-top-right-radius:4px;color:#fff;}
  .msg-bubble a{color:var(--accent3);text-decoration:underline;}
  .msg-time{font-size:0.65rem;color:var(--text2);margin-top:4px;opacity:0.6;}

  /* Typing indicator */
  .typing{display:flex;gap:4px;padding:14px 16px;align-items:center;}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--accent2);
    animation:bounce 1.2s ease-in-out infinite;}
  .typing span:nth-child(2){animation-delay:0.2s}
  .typing span:nth-child(3){animation-delay:0.4s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}

  /* Input area */
  .input-area{padding:16px;background:rgba(13,2,33,0.9);backdrop-filter:blur(20px);
    border-top:1px solid var(--border);}
  .quick-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .quick-btn{background:transparent;border:1px solid var(--border);color:var(--text2);
    padding:5px 12px;border-radius:20px;font-size:0.73rem;cursor:pointer;
    transition:all 0.2s;white-space:nowrap;}
  .quick-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff;}
  .input-row{display:flex;gap:10px;align-items:flex-end;}
  textarea{flex:1;background:var(--surface);border:1px solid var(--border);
    color:var(--text);padding:12px 16px;border-radius:24px;font-size:0.88rem;
    resize:none;outline:none;font-family:inherit;line-height:1.5;
    max-height:120px;transition:border-color 0.2s;}
  textarea:focus{border-color:var(--accent);}
  textarea::placeholder{color:var(--text2);opacity:0.6;}
  .send-btn{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;transition:all 0.2s;color:#fff;}
  .send-btn:hover{transform:scale(1.08);box-shadow:0 0 20px rgba(124,58,237,0.5);}
  .send-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
  .send-btn svg{width:18px;height:18px;}

  /* Welcome card */
  .welcome{background:linear-gradient(135deg,var(--surface),var(--surface2));
    border:1px solid var(--border);border-radius:20px;padding:24px;
    text-align:center;margin:8px 0 4px;}
  .welcome img{width:72px;height:72px;border-radius:50%;border:3px solid var(--accent3);margin-bottom:12px;}
  .welcome h2{color:var(--accent3);font-size:1.1rem;margin-bottom:6px;}
  .welcome p{color:var(--text2);font-size:0.83rem;line-height:1.6;}

  @media(max-width:600px){.msg-bubble{max-width:88%}.quick-btn{font-size:0.68rem}}
</style>
</head>
<body>

<!-- Animated background -->
<div class="bg-particles" id="particles"></div>

<!-- Header -->
<div class="header">
  <div class="avatar">
    <img src="https://avatars.githubusercontent.com/anilcodematrix?v=4" alt="Anil"/>
  </div>
  <div class="header-info">
    <h1>Anil Sharma</h1>
    <p>AI assistant - ask anything, no API key needed</p>
  </div>
  <div class="status-dot" title="Online"></div>
  <a href="https://github.com/anilcodematrix" target="_blank" class="github-link">View Profile</a>
</div>

<!-- Chat -->
<div class="chat-wrap">
  <div class="messages" id="messages">
    <div class="msg bot">
      <div class="msg-avatar">A</div>
      <div>
        <div class="welcome">
          <img src="https://avatars.githubusercontent.com/anilcodematrix?v=4" alt="Anil"/>
          <h2>Hi! I am Anil Sharma's AI</h2>
          <p>I am the personal AI assistant of Anil Kumar Sutihar Sharma.<br/>
             Ask me anything: coding, studies, ideas, general questions,<br/>
             or about Anil's skills, projects and how to hire him.</p>
        </div>
        <div class="msg-time">Just now</div>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="quick-btns">
      <button class="quick-btn" onclick="send('Who is Anil?')">Who is Anil?</button>
      <button class="quick-btn" onclick="send('What is his tech stack?')">Tech Stack</button>
      <button class="quick-btn" onclick="send('What projects has he built?')">Projects</button>
      <button class="quick-btn" onclick="send('Is he available to hire?')">Available to hire?</button>
      <button class="quick-btn" onclick="send('How can I contact Anil?')">Contact</button>
      <button class="quick-btn" onclick="send('What is RAG?')">What is RAG?</button>
    </div>
    <div class="input-row">
      <textarea id="userInput" placeholder="Ask anything..." rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"
        oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMsg()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>

<script src="bot.js?v=5"></script>
</body>
</html>
